<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcaea · 随机曲目抽取器</title>
<style>
  :root{
    --bg:#0a0118; --bg2:#150a2b; --card:rgba(30,16,58,.62);
    --purple:#9d4edd; --blue:#4cc9f0; --pink:#f72585; --cyan:#00f5d4;
    --gold:#ffd60a; --text:#ece6fb; --dim:#9a8ec0; --line:rgba(157,78,221,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;max-width:100vw;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;padding:18px 14px 40px}
  .bg{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(900px 600px at 12% -10%,rgba(157,78,221,.30),transparent 60%),
    radial-gradient(800px 600px at 92% 8%,rgba(76,201,240,.22),transparent 60%),
    radial-gradient(700px 700px at 50% 115%,rgba(247,37,133,.18),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg))}
  .grid{position:fixed;inset:0;z-index:-1;opacity:.14;
    background-image:linear-gradient(rgba(157,78,221,.5) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(157,78,221,.5) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 35%,#000 20%,transparent 78%);
    mask-image:radial-gradient(circle at 50% 35%,#000 20%,transparent 78%)}
  .star{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.45;z-index:-1;animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.7;transform:scale(1.2)}}
  .wrap{width:100%;max-width:600px;min-width:0;overflow-x:hidden}
  header{text-align:center;margin-bottom:16px}
  .brand{font-size:12px;letter-spacing:.42em;color:var(--dim)}
  h1{margin:6px 0 0;font-size:23px;font-weight:800;letter-spacing:.05em;
    background:linear-gradient(92deg,var(--cyan),var(--blue),var(--purple),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(157,78,221,.5))}
  .sub{margin-top:6px;font-size:11.5px;color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
    padding:16px;margin-bottom:14px}
  .stage{position:relative;text-align:center;padding:22px 14px 20px;overflow:hidden;border-radius:18px;
    background:linear-gradient(160deg,rgba(157,78,221,.16),rgba(76,201,240,.07));
    border:1px solid var(--line);margin-bottom:12px}
  .stage::after{content:"";position:absolute;inset:-40%;
    background:conic-gradient(from 0deg,transparent 0deg,rgba(157,78,221,.16) 60deg,transparent 130deg);
    animation:spin 7s linear infinite;z-index:0;opacity:0;transition:opacity .3s}
  .stage.rolling::after{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .stage>*{position:relative;z-index:1}
  .song{font-size:26px;font-weight:800;line-height:1.25;min-height:34px;
    word-break:break-word;transition:color .2s}
  .diffrow{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:8px 0 4px}
  .diff{font-size:15px;font-weight:900;letter-spacing:.12em;padding:3px 11px;border-radius:8px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
  .num{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s,text-shadow .2s}
  .packname{font-size:11.5px;color:var(--dim);letter-spacing:.05em}
  .tagline{font-size:12px;color:var(--dim);min-height:17px;margin-top:6px;letter-spacing:.04em}
  .stage.hit{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
  .burst{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;
    transform:translate(-50%,-50%);pointer-events:none;opacity:0;
    background:radial-gradient(circle,#fff,rgba(255,255,255,0) 68%)}
  .burst.go{animation:burst .6s ease-out}
  @keyframes burst{0%{opacity:.95;width:12px;height:12px}100%{opacity:0;width:540px;height:540px}}
  .draw{width:100%;border:none;border-radius:16px;padding:18px;cursor:pointer;
    font-size:19px;font-weight:900;letter-spacing:.22em;color:#fff;font-family:inherit;
    background:linear-gradient(96deg,var(--purple),var(--blue));
    box-shadow:0 10px 30px rgba(157,78,221,.48),inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .09s,box-shadow .22s,filter .22s}
  .draw:hover{box-shadow:0 14px 40px rgba(76,201,240,.6);filter:brightness(1.08)}
  .draw:active{transform:scale(.977)}
  .draw:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.25)}
  .row2{display:flex;gap:10px;margin-top:10px}
  .row2 button{flex:1;border:1px solid var(--line);background:rgba(157,78,221,.12);color:var(--text);
    border-radius:13px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s,transform .09s}
  .row2 button:hover{background:rgba(157,78,221,.26)}
  .row2 button:active{transform:scale(.97)}
  h2{font-size:11.5px;letter-spacing:.18em;color:var(--dim);margin:0 0 9px;font-weight:700}
  h2 .cnt{color:var(--purple);letter-spacing:0;font-weight:800}
  .chips{display:flex;flex-wrap:wrap;gap:7px;min-width:0}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--dim);
    border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer;
    letter-spacing:.04em;font-family:inherit;transition:all .16s;user-select:none;
    max-width:100%;overflow-wrap:anywhere;word-break:break-word;line-height:1.32;text-align:left}
  .chip:hover{border-color:rgba(157,78,221,.75)}
  .chip.on{color:#fff;background:linear-gradient(140deg,rgba(157,78,221,.55),rgba(76,201,240,.3));
    border-color:rgba(200,160,255,.85);box-shadow:0 0 14px rgba(157,78,221,.45)}
  .chip.d-FTR.on{background:linear-gradient(140deg,rgba(76,201,240,.6),rgba(76,201,240,.22));box-shadow:0 0 14px rgba(76,201,240,.5)}
  .chip.d-ETR.on{background:linear-gradient(140deg,rgba(199,125,255,.6),rgba(199,125,255,.22));box-shadow:0 0 14px rgba(199,125,255,.5)}
  .chip.d-BYD.on{background:linear-gradient(140deg,rgba(247,37,133,.6),rgba(247,37,133,.22));box-shadow:0 0 14px rgba(247,37,133,.5)}
  .chip.d-INS.on{background:linear-gradient(140deg,rgba(255,214,10,.55),rgba(255,214,10,.2));box-shadow:0 0 14px rgba(255,214,10,.45)}
  .chip.tiny{padding:5px 9px;font-size:11.5px}
  .quickrow{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .mini{border:1px dashed rgba(157,78,221,.5);background:transparent;color:var(--dim);
    border-radius:9px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
  .mini:hover{color:var(--text);border-color:var(--purple)}
  .toggles{display:flex;flex-wrap:wrap;gap:16px;margin-top:13px;padding-top:11px;border-top:1px dashed rgba(157,78,221,.3)}
  .toggles label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);cursor:pointer}
  .toggles input{width:16px;height:16px;accent-color:var(--purple);cursor:pointer}
  .hist{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow:auto}
  .hi{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 10px;border-radius:10px;
    background:rgba(255,255,255,.035);border:1px solid rgba(157,78,221,.16)}
  .hi .i{color:var(--dim);font-size:11px;min-width:20px}
  .hi .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hi .dd{font-weight:800;font-size:11px;letter-spacing:.06em}
  .hi .nn{font-weight:800;min-width:30px;text-align:right}
  .empty{color:var(--dim);font-size:12.5px;text-align:center;padding:12px}
  .batchlist{display:flex;flex-direction:column;gap:6px}
  .bitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
    background:linear-gradient(90deg,rgba(157,78,221,.16),rgba(76,201,240,.06));
    border:1px solid rgba(157,78,221,.3);animation:slidein .28s ease}
  @keyframes slidein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .bitem .no{width:22px;height:22px;border-radius:50%;background:rgba(157,78,221,.4);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex:0 0 auto}
  .bitem .bnm{flex:1;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bitem .bdd{font-weight:900;font-size:11.5px;letter-spacing:.06em}
  .bitem .blv{font-weight:900;font-size:17px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .batchtip{font-size:11px;color:var(--dim);text-align:center;margin-top:9px}
  h2 .mini{float:right;margin-top:-2px}
  .statline{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:6px}
  .statline .k{min-width:44px;font-weight:800;color:var(--dim);letter-spacing:.04em}
  .bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:5px;transition:width .45s cubic-bezier(.2,1,.3,1)}
  .statline .v{min-width:28px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
  .sum{font-size:11.5px;color:var(--dim);text-align:right;margin-top:8px}
  footer{text-align:center;font-size:11px;color:var(--dim);opacity:.75;margin-top:16px;line-height:1.8}
  kbd{background:rgba(157,78,221,.2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px}
</style>

<body>
<div class="bg"></div><div class="grid"></div>
<div class="wrap">
  <header>
    <div class="brand">Arcaea</div>
    <h1>随机曲目抽取器</h1>
    <div class="sub" id="subline">加载中…</div>
  </header>

  <div class="stage" id="stage">
    <div class="burst" id="burst"></div>
    <div class="song" id="song">准备就绪</div>
    <div class="diffrow"><span class="diff" id="diff">--</span><span class="num" id="num">--</span></div>
    <div class="packname" id="packname"></div>
    <div class="tagline" id="tag">点击下方按钮开始抽取</div>
  </div>

  <button class="draw" id="draw">抽　取</button>
  <div class="row2">
    <button id="multi">连抽 ×3</button>
    <button id="clear">重置统计</button>
  </div>

  <div class="card" id="batchCard" style="display:none;margin-top:14px;border-color:rgba(200,160,255,.5)">
    <h2>本轮抽取顺序 <span class="cnt" id="batchCnt"></span>
      <button class="mini" id="batchClear">清空本轮</button>
    </h2>
    <div class="batchlist" id="batch"></div>
    <div class="batchtip">按这个顺序打就行 🎯</div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>曲包 <span class="cnt" id="packCnt"></span></h2>
    <div class="chips" id="packChips"></div>
    <div class="quickrow">
      <button class="mini" id="pickMain">只选主线</button>
      <button class="mini" id="pickAll">全选</button>
      <button class="mini" id="pickNone">全不选</button>
    </div>
    <h2 style="margin-top:16px">难度类型 <span class="cnt" id="diffCnt"></span></h2>
    <div class="chips" id="diffChips"></div>
    <h2 style="margin-top:16px">难度等级 <span class="cnt" id="lvCnt"></span></h2>
    <div class="chips" id="lvChips"></div>
    <div class="toggles">
      <label><input type="checkbox" id="sfx" checked> 音效</label>
      <label><input type="checkbox" id="shake" checked> 震动反馈</label>
    </div>
  </div>

  <div class="card">
    <h2>历史记录</h2>
    <div class="hist" id="hist"><div class="empty">还没有记录～</div></div>
  </div>

  <div class="card">
    <h2>统计分布</h2>
    <div id="stats"></div>
    <div class="sum" id="sum"></div>
  </div>

  <footer>
    快捷键：<kbd>空格</kbd> 抽取　<kbd>R</kbd> 重置<br>
    曲目/难度数据来自萌娘百科 Arcaea 谱面信息（357 首）· 数据仅存本机
  </footer>
</div>

  var state = { packs: [], diffs: DIFFS.slice(), lvs: LVS.slice(), hist: [], stats: {}, sfx: true, shake: true, rolling: false, batch: [], batchNo: 0 };
  var allPacks = [];
  var packCount = {};

  // ---------- 音效 ----------
  var ac = null;
  function ensureAudio() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  function tone(f, d, t, v, dl) {
    if (!state.sfx || !ac) return;
    try {
      var t0 = ac.currentTime + (dl || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = t || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(v == null ? .14 : v, t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + .02);
    } catch (e) {}
  }
  function sfxTick() { tone(1100 + Math.random() * 500, .035, 'square', .05); }
  function sfxHit() { tone(523.25, .16, 'triangle', .16); tone(783.99, .16, 'triangle', .14, .07); tone(1046.5, .26, 'sine', .16, .14); }
  function sfxSoft() { tone(660, .08, 'sine', .09); }

  // ---------- 池 ----------
  function validPairs() {
    var pool = [];
    for (var i = 0; i < ARCAEA_SONGS.length; i++) {
      var s = ARCAEA_SONGS[i];
      if (state.packs.indexOf(s[1]) < 0) continue;
      // FTR
      if (state.diffs.indexOf('FTR') >= 0 && s[2] && state.lvs.indexOf(s[2]) >= 0) {
        pool.push({ n: s[0], p: s[1], d: 'FTR', lv: s[2], c: s[3] });
      }
      // 第四难度
      if (s[4] && state.diffs.indexOf(s[4]) >= 0 && s[5] && state.lvs.indexOf(s[5]) >= 0) {
        pool.push({ n: s[0], p: s[1], d: s[4], lv: s[5], c: s[6] });
      }
    }
    return pool;
  }

  // ---------- UI ----------
  function buildChips() {
    var pc = el('packChips'), dc = el('diffChips'), lc = el('lvChips');
    pc.innerHTML = ''; dc.innerHTML = ''; lc.innerHTML = '';
    allPacks.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'chip tiny' + (MAIN_PACKS.indexOf(p) >= 0 ? ' on' : '');
      b.textContent = p + ' ' + packCount[p];
      b.dataset.pack = p;
      b.onclick = function () {
        var i = state.packs.indexOf(p);
        if (i >= 0) state.packs.splice(i, 1); else state.packs.push(p);
        b.classList.toggle('on', i < 0);
        sfxSoft(); refreshUI(); save();
      };
      pc.appendChild(b);
    });
    DIFFS.forEach(function (d) {
      var b = document.createElement('button');
      b.className = 'chip d-' + d + ' on';
      b.textContent = d;
      b.dataset.diff = d;
      b.onclick = function () {
        var i = state.diffs.indexOf(d);
        if (i >= 0) { if (state.diffs.length === 1) return; state.diffs.splice(i, 1); }
        else state.diffs.push(d);
        sfxSoft(); syncChips(); save();
      };
      dc.appendChild(b);
    });
    LVS.forEach(function (L) {
      var b = document.createElement('button');
      b.className = 'chip on'; b.textContent = L; b.dataset.lv = L;
      b.onclick = function () {
        var i = state.lvs.indexOf(L);
        if (i >= 0) { if (state.lvs.length === 1) return; state.lvs.splice(i, 1); }
        else state.lvs.push(L);
        sfxSoft(); syncChips(); save();
      };
      lc.appendChild(b);
    });
  }
  function syncChips() {
    document.querySelectorAll('#packChips .chip').forEach(function (b) {
      b.classList.toggle('on', state.packs.indexOf(b.dataset.pack) >= 0);
    });
    document.querySelectorAll('#diffChips .chip').forEach(function (b) {
      var d = b.dataset.diff, on = state.diffs.indexOf(d) >= 0;
      b.classList.toggle('on', on);
      // 该难度在选中的等级里有没有歌
      var has = DIFF_LVS[d].some(function (x) { return state.lvs.indexOf(x) >= 0; });
      b.style.opacity = has ? '' : '.35';
    });
    document.querySelectorAll('#lvChips .chip').forEach(function (b) {
      b.classList.toggle('on', state.lvs.indexOf(b.dataset.lv) >= 0);
    });
    el('sfx').checked = state.sfx;
    el('shake').checked = state.shake;
  }
  function refreshUI() {
    syncChips();
    var pool = validPairs();
    el('packCnt').textContent = '已选 ' + state.packs.length + '/' + allPacks.length;
    el('diffCnt').textContent = state.diffs.join(' ');
    el('lvCnt').textContent = state.lvs.join(' ');
    el('subline').textContent = '357 首曲目 · 当前可抽 ' + pool.length + ' 个谱面';
    if (!pool.length) el('tag').textContent = '当前勾选没有可抽取的谱面';
  }

  // ---------- 抽取 ----------
  var ROLL_MS = 1500;
  var pendingDone = null;
  function roll(isBatch, onDone) {
    if (state.rolling) return;
    pendingDone = onDone || null;
    var pool = validPairs();
    if (!pool.length) { el('tag').textContent = '当前勾选没有可抽取的谱面（换个曲包/难度）'; pendingDone = null; return; }
    state.rolling = true;
    ensureAudio();
    if (ac && ac.state === 'suspended') ac.resume();
    el('draw').disabled = true; el('multi').disabled = true;
    var stage = el('stage');
    stage.classList.add('rolling');
    var t0 = Date.now(), lastTick = 0, settled = false;
    var final = pool[Math.floor(Math.random() * pool.length)];
    function settle() {
      if (settled) return;
      settled = true;
      clearTimeout(guard);
      finish(final);
    }
    // 兜底：切后台标签页时 rAF 会暂停，用定时器保证一定能结算
    var guard = setTimeout(settle, ROLL_MS + 900);
    function frame() {
      var t = Date.now() - t0;
      if (t < ROLL_MS) {
        var r = pool[Math.floor(Math.random() * pool.length)];
        paint(r, true);
        if (t - lastTick > 70) { lastTick = t; sfxTick(); }
        requestAnimationFrame(frame);
      } else { settle(); }
    }
    requestAnimationFrame(frame);
  }
  function paint(r, rolling) {
    el('song').textContent = r.n;
    el('diff').textContent = r.d;
    el('diff').style.color = DCOLOR[r.d];
    el('diff').style.borderColor = DCOLOR[r.d] + '88';
    el('num').textContent = r.lv;
    if (rolling) { el('num').style.textShadow = ''; el('packname').textContent = ''; }
  }
  function finish(r) {
    var stage = el('stage');
    stage.classList.remove('rolling');
    paint(r, false);
    var c = DCOLOR[r.d];
    el('num').style.color = c;
    el('num').style.textShadow = '0 0 26px ' + c + ', 0 0 60px ' + c + '80';
    el('song').style.color = '#fff';
    el('packname').textContent = r.p + (r.c ? '　·　定数 ' + r.c.toFixed(1) : '');
    el('tag').textContent = QUOTES[r.lv][Math.floor(Math.random() * QUOTES[r.lv].length)];
    stage.classList.remove('hit'); void stage.offsetWidth; stage.classList.add('hit');
    var b = el('burst');
    b.style.background = 'radial-gradient(circle,' + c + ',rgba(255,255,255,0) 68%)';
    b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
    sfxHit();
    if (state.shake && navigator.vibrate) { try { navigator.vibrate(r.d === 'INS' || r.d === 'BYD' ? 55 : 25); } catch (e) {} }
    var key = r.d + ' ' + r.lv;
    state.stats[key] = (state.stats[key] || 0) + 1;
    state.batch.push({ n: r.n, d: r.d, lv: r.lv, p: r.p });
    state.hist.unshift({ n: r.n, d: r.d, lv: r.lv, p: r.p, b: state.batchNo });
    if (state.hist.length > 80) state.hist.pop();
    save(); renderHist(); renderStats(); renderBatch(); refreshUI();
    state.rolling = false;
    el('draw').disabled = false; el('multi').disabled = false;
    if (pendingDone) { var cb = pendingDone; pendingDone = null; setTimeout(cb, 380); }
  }

  // ---------- 本轮抽取顺序 ----------
  function newRound() {
    state.batch = [];
    state.batchNo++;
    renderBatch();
  }
  function renderBatch() {
    var card = el('batchCard'), box = el('batch');
    if (!card || !box) return;
    if (!state.batch.length) { card.style.display = 'none'; return; }
    card.style.display = '';
    el('batchCnt').textContent = state.batch.length + ' 个';
    box.innerHTML = '';
    state.batch.forEach(function (r, i) {
      var d = document.createElement('div');
      d.className = 'bitem';
      d.innerHTML = '<span class="no">' + (i + 1) + '</span>' +
        '<span class="bnm">' + r.n + '</span>' +
        '<span class="bdd" style="color:' + DCOLOR[r.d] + '">' + r.d + '</span>' +
        '<span class="blv">' + r.lv + '</span>';
      box.appendChild(d);
    });
  }

  // ---------- 历史 / 统计 ----------
  function renderHist() {
    var box = el('hist');
    if (!state.hist.length) { box.innerHTML = '<div class="empty">还没有记录～</div>'; return; }
    box.innerHTML = '';
    state.hist.slice(0, 40).forEach(function (h, i) {
      var d = document.createElement('div');
      d.className = 'hi';
      d.innerHTML = '<span class="i">' + (i + 1) + '</span>' +
        '<span class="nm">' + h.n + '</span>' +
        '<span class="dd" style="color:' + DCOLOR[h.d] + '">' + h.d + '</span>' +
        '<span class="nn">' + h.lv + '</span>';
      box.appendChild(d);
    });
  }
  function renderStats() {
    var box = el('stats'); box.innerHTML = '';
    var total = 0;
    Object.keys(state.stats).forEach(function (k) { total += state.stats[k]; });
    // 按难度
    var byD = {}; DIFFS.forEach(function (d) { byD[d] = 0; });
    Object.keys(state.stats).forEach(function (k) {
      var d = k.split(' ')[0]; if (byD[d] != null) byD[d] += state.stats[k];
    });
    var maxD = Math.max(1, Math.max.apply(null, DIFFS.map(function (d) { return byD[d]; })));
    DIFFS.forEach(function (d) {
      var line = document.createElement('div');
      line.className = 'statline';
      line.innerHTML = '<span class="k" style="color:' + DCOLOR[d] + '">' + d + '</span>' +
        '<span class="bar"><i style="width:' + (byD[d] / maxD * 100) + '%;background:' + DCOLOR[d] + '"></i></span>' +
        '<span class="v">' + byD[d] + '</span>';
      box.appendChild(line);
    });
    // 按等级
    var byL = {}; LVS.forEach(function (L) { byL[L] = 0; });
    Object.keys(state.stats).forEach(function (k) {
      var L = k.split(' ')[1]; if (byL[L] != null) byL[L] += state.stats[k];
    });
    var maxL = Math.max(1, Math.max.apply(null, LVS.map(function (L) { return byL[L]; })));
    LVS.forEach(function (L) {
      var line = document.createElement('div');
      line.className = 'statline';
      line.innerHTML = '<span class="k">' + L + '</span>' +
        '<span class="bar"><i style="width:' + (byL[L] / maxL * 100) + '%;background:linear-gradient(90deg,#4cc9f0,#9d4edd)"></i></span>' +
        '<span class="v">' + byL[L] + '</span>';
      box.appendChild(line);
    });
    el('sum').textContent = total ? ('共抽取 ' + total + ' 次') : '还没有数据';
  }

  // ---------- 存储 ----------
  function save() {
    try {
      localStorage.setItem(SAVE, JSON.stringify({
        packs: state.packs, diffs: state.diffs, lvs: state.lvs,
        hist: state.hist.slice(0, 80), stats: state.stats, sfx: state.sfx, shake: state.shake
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(SAVE) || 'null');
      if (!d) return false;
      if (Array.isArray(d.packs) && d.packs.length) state.packs = d.packs.filter(function (p) { return allPacks.indexOf(p) >= 0; });
      if (Array.isArray(d.diffs) && d.diffs.length) state.diffs = d.diffs.filter(function (x) { return DIFFS.indexOf(x) >= 0; });
      if (Array.isArray(d.lvs) && d.lvs.length) state.lvs = d.lvs.filter(function (x) { return LVS.indexOf(x) >= 0; });
      if (Array.isArray(d.hist)) state.hist = d.hist;
      if (d.stats && typeof d.stats === 'object') state.stats = d.stats;
      state.sfx = d.sfx !== false; state.shake = d.shake !== false;
      if (!state.diffs.length) state.diffs = DIFFS.slice();
      if (!state.lvs.length) state.lvs = LVS.slice();
      return true;
    } catch (e) { return false; }
  }

  // ---------- 事件 ----------
  el('draw').onclick = function () { newRound(); roll(false); };
  el('multi').onclick = function () {
    if (state.rolling) return;
    newRound();
    var done = 0;
    (function step() {
      if (done >= 3) return;
      done++;
      roll(true, step);
    })();
  };
  el('batchClear').onclick = function () { state.batch = []; renderBatch(); sfxSoft(); };
  el('clear').onclick = function () {
    if (!confirm('确定清空历史和统计吗？')) return;
    state.hist = []; state.stats = {}; save(); renderHist(); renderStats(); refreshUI();
    el('song').textContent = '已重置'; el('diff').textContent = '--'; el('num').textContent = '--';
    el('num').style.textShadow = ''; el('packname').textContent = ''; el('tag').textContent = '点击下方按钮开始抽取';
    sfxSoft();
  };
  el('pickMain').onclick = function () {
    state.packs = allPacks.filter(function (p) { return MAIN_PACKS.indexOf(p) >= 0; });
    sfxSoft(); refreshUI(); save();
  };
  el('pickAll').onclick = function () { state.packs = allPacks.slice(); sfxSoft(); refreshUI(); save(); };
  el('pickNone').onclick = function () { state.packs = []; sfxSoft(); refreshUI(); save(); };
  el('sfx').onchange = function () { state.sfx = this.checked; save(); if (state.sfx) { ensureAudio(); sfxSoft(); } };
  el('shake').onchange = function () { state.shake = this.checked; save(); };
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); roll(); }
    else if (e.key === 'r' || e.key === 'R') { el('clear').click(); }
  });
  ['click', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function once() { ensureAudio(); if (ac && ac.state === 'suspended') ac.resume(); }, { once: true });
  });

  // 星尘
  (function () {
    for (var i = 0; i < 44; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.animationDelay = (Math.random() * 3) + 's';
      document.body.appendChild(s);
    }
  })();

  // ---------- 启动 ----------
  (function init() {
    var seen = {};
    ARCAEA_SONGS.forEach(function (s) {
      var p = s[1];
      if (!p) return;
      if (!seen[p]) { seen[p] = 1; allPacks.push(p); packCount[p] = 0; }
      packCount[p]++;
    });
    // 主线包排前面
    allPacks.sort(function (a, b) {
      var ma = MAIN_PACKS.indexOf(a), mb = MAIN_PACKS.indexOf(b);
      if (ma >= 0 && mb >= 0) return ma - mb;
      if (ma >= 0) return -1;
      if (mb >= 0) return 1;
      return a.localeCompare(b);
    });
    var has = load();
    if (!has || !state.packs.length) {
      state.packs = allPacks.filter(function (p) { return MAIN_PACKS.indexOf(p) >= 0; });
    }
    buildChips(); refreshUI(); renderHist(); renderStats();
  })();
})();
</script>
<script>
(function () {
  if (!("serviceWorker" in navigator)) return;
  if (location.protocol === "file:") {
    console.log("[PWA] file:// 打开，Service Worker 不可用（用本地服务器打开即可离线）");
    return;
  }
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function () {
      console.log("[PWA] Service Worker 已注册（可离线使用）");
    }).catch(function (e) { console.log("[PWA] SW 注册失败: " + (e && e.message)); });
  });
})();
</script>
